# Production-style stack for a single VPS (fixed monthly cost, large transfer pool).
# Run from this directory after copying env.production.example → .env
# See README.md in this folder.

name: spine

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spine} -d ${POSTGRES_DB:-spine}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn spine.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A spine.worker.celery_app worker --loglevel=info

  dashboard:
    build:
      context: ../../spine-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BFF_PORT: "4173"
      SERVE_STATIC: "true"
      NODE_ENV: production
      SPINE_BASE_URL: http://api:8000
      SPINE_ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Load SITE_ADDRESS from .env inside the container (not compose-time ${SITE_ADDRESS:-:80},
    # which often stayed :80 after hostname changes and broke automatic HTTPS on 443).
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
