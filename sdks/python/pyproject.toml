[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-sdk"
version = "0.1.0"
description = "Thin Spine control-plane client (Python)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["spine_sdk*"]
