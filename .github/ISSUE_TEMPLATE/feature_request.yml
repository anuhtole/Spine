name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation, not the solution. What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: If you have a specific design, describe it. If not, that is fine — leave it blank.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Policy expressiveness
        - Plan-bound monitoring
        - Audit and compliance
        - Framework integration (LangChain, CrewAI, MCP, ...)
        - Dashboard
        - SDKs
        - Deployment and operations
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are using today, or other tools you considered.
